const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function kdf(pw){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:d(P.s),iterations:P.n,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt'])}
async function open_(k){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.i)},k,d(CT));const h=new TextDecoder().decode(pt);document.open();document.write(h);document.close()}
const er=document.getElementById('er'),bt=document.getElementById('bt');
addEventListener('load',async()=>{const s=sessionStorage.getItem('pvk');if(!s)return;try{const k=await crypto.subtle.importKey('raw',d(s),'AES-GCM',false,['decrypt']);await open_(k)}catch(e){sessionStorage.removeItem('pvk')}});
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value;if(!pw){er.textContent='Digite a senha.';return}
if(!window.crypto||!crypto.subtle){er.textContent='Abra pelo endereço https do site.';return}
bt.disabled=true;bt.textContent='Verificando…';er.textContent='';
try{const k=await kdf(pw);const raw=new Uint8Array(await crypto.subtle.exportKey('raw',k));if(document.getElementById('rm').checked)sessionStorage.setItem('pvk',btoa(String.fromCharCode(...raw)));await open_(k)}
catch(x){er.textContent='Senha incorreta.';bt.disabled=false;bt.textContent='Entrar';document.getElementById('pw').select()}});
</script></body></html>
